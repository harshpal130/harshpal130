<svg xmlns="http://www.w3.org/2000/svg"
     width="487"
     height="381"
     viewBox="0 0 487 381">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111722"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
</defs>

<!-- Terminal window -->
<rect width="487" height="381" rx="12" fill="url(#bg)"/>

<rect x=".5"
      y=".5"
      width="486"
      height="380"
      rx="12"
      fill="none"
      stroke="#30363d"/>

<!-- Terminal header -->
<line x1="0" y1="28" x2="487" y2="28" stroke="#30363d"/>

<circle cx="18" cy="14" r="4.5" fill="#ff5f56"/>
<circle cx="33" cy="14" r="4.5" fill="#ffbd2e"/>
<circle cx="48" cy="14" r="4.5" fill="#27c93f"/>

<text x="243"
      y="18"
      fill="#7d8590"
      font-family="ui-monospace,monospace"
      font-size="11.5"
      text-anchor="middle">
  harshpal130@github: ~$ ./wordmark.sh --3d
</text>

<!-- Main wordmark -->
<g font-family="ui-monospace,monospace"
   font-weight="700"
   text-anchor="middle">

  <!-- shadow / extrusion -->
  <text x="252"
        y="244"
        font-size="82"
        letter-spacing="4"
        fill="#30363d">
    HARSH
  </text>

  <text x="250"
        y="242"
        font-size="82"
        letter-spacing="4"
        fill="#484f58">
    HARSH
  </text>

  <text x="248"
        y="240"
        font-size="82"
        letter-spacing="4"
        fill="#6e7681">
    HARSH
  </text>

  <!-- main face -->
  <text x="244"
        y="236"
        font-size="82"
        letter-spacing="4"
        fill="#f0f6fc">
    HARSH
  </text>

  <!-- tagline -->
  <text x="244"
        y="285"
        font-size="14"
        letter-spacing="3"
        fill="#8b949e">
    FULL STACK • AI/ML • BUILDER
  </text>

</g>

</svg>
